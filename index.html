<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LogReporter</title>
  <!-- Bump ?v= on every asset when shipping a change: browsers keep serving a
       cached copy of these files otherwise, and the dashboard silently runs
       last week's code. -->
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <!-- data layer first -->
  <script src="script/sample-logs.js?v=8"></script>
  <script src="script/time-model.js?v=8"></script>
  <script src="script/filters.js?v=8"></script>
  <script src="script/db.js?v=8"></script>
  <script src="script/app.js?v=8"></script>
  <!-- components: base + helpers first, app-shell last -->
  <script src="components/log-component.js?v=8"></script>
  <script src="components/log-header.js?v=8"></script>
  <script src="components/log-filters.js?v=8"></script>
  <script src="components/log-tree.js?v=8"></script>
  <script src="components/log-list.js?v=8"></script>
  <script src="components/log-details.js?v=8"></script>
  <script src="components/log-timeline.js?v=8"></script>
  <script src="components/log-timegoes.js?v=8"></script>
  <script src="components/log-metrics.js?v=8"></script>
  <script src="components/log-maintenance.js?v=8"></script>
  <script src="components/log-help.js?v=8"></script>
  <script src="components/log-footer.js?v=8"></script>
  <script src="components/app-shell.js?v=8"></script>
</body>
</html>
