<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The brand mark reduced for the tab strip. At 16px the foot's category
       segments merge into one muddy band, so the favicon keeps the silhouette
       and drops the split; the strokes are thickened from 5.6 to 7 for the
       same reason. Colours are literals rather than tokens because a favicon
       is fetched as its own document and cannot see style.css — it is the
       one place in the project where a colour literal is unavoidable. The
       brand red (Task 0010, Paper & Ink) reads on both tab strips, so the
       old per-scheme media query is gone. Corners are square, like every
       other corner in the brand. -->
  <style>
    .ell { fill: #ec3013; }
  </style>
  <rect class="ell" x="5.5" y="4" width="7" height="24"/>
  <rect class="ell" x="5.5" y="21" width="21" height="7"/>
</svg>
